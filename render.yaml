services:
  # ── Web API ─────────────────────────────────────────────────────────────────
  - type: web
    name: glucosense-api
    runtime: python
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      # Database — set in Render dashboard, do not commit the real value
      - key: DATABASE_URL
        sync: false

      # Auth
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"

      # AI coach (Claude) — server-side only; the mobile app never holds this key.
      # If ANTHROPIC_API_KEY is unset the coach falls back to safe rule-based replies.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: COACH_MODEL
        value: "claude-sonnet-4-6"
      - key: COACH_MAX_TOKENS
        value: "1024"

      # Junction wearable (PRIMARY CGM)
      - key: JUNCTION_BASE_URL
        value: "https://api.sandbox.us.junction.com"
      - key: JUNCTION_API_KEY
        sync: false
      - key: JUNCTION_WEBHOOK_SECRET
        sync: false

      # Web UI / security
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FIELD_ENCRYPTION_KEY     # Fernet key for secrets at rest
        sync: false
      - key: CGM_STALENESS_MINUTES
        value: "20"

      # Google Fit (sole watch source)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false

      # Celery broker (API needs this to dispatch retrain tasks)
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: glucosense-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: glucosense-redis
          property: connectionString

      # Model config
      - key: MODEL_DIR
        value: "models"
      - key: RESAMPLE_INTERVAL_MINUTES
        value: "15"
      - key: DEFAULT_INPUT_WINDOW_HOURS
        value: "6"
      - key: DEFAULT_POPULATION_MODEL
        value: "cgmacros"
      - key: RMSE_DRIFT_ALERT_THRESHOLD_PCT
        value: "20"
      - key: MIN_ROWS_FOR_INDIVIDUAL_MODEL
        value: "1344"

      # Feature flags
      - key: ENABLE_AI_RECOMMENDATIONS
        value: "true"
      - key: ENABLE_INDIVIDUAL_RETRAIN
        value: "true"
      - key: MAX_RETRAIN_QUEUE_SIZE
        value: "5"
      - key: ENABLE_SLEEP_FEATURES
        value: "false"
      - key: ENABLE_STRESS_FEATURES
        value: "false"

  # ── Celery worker ────────────────────────────────────────────────────────────
  - type: worker
    name: glucosense-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A src.tasks.celery_app worker --beat --loglevel=info -Q glucosense --concurrency=1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      # Database — same value as the API
      - key: DATABASE_URL
        sync: false

      # Celery broker
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: glucosense-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: glucosense-redis
          property: connectionString

      # Model config (used by retrain task)
      - key: MODEL_DIR
        value: "models"
      - key: RESAMPLE_INTERVAL_MINUTES
        value: "15"
      - key: DEFAULT_INPUT_WINDOW_HOURS
        value: "6"
      - key: DEFAULT_POPULATION_MODEL
        value: "cgmacros"
      - key: RMSE_DRIFT_ALERT_THRESHOLD_PCT
        value: "20"
      - key: MAX_RETRAIN_QUEUE_SIZE
        value: "5"

      # Junction scheduled pull (celery beat) + failover + secrets-at-rest
      - key: JUNCTION_BASE_URL
        value: "https://api.sandbox.us.junction.com"
      - key: JUNCTION_API_KEY
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: CGM_STALENESS_MINUTES
        value: "20"
      - key: CGM_POLL_INTERVAL_SEC
        value: "600"

  # ── Managed Redis (Celery broker + result backend) ───────────────────────────
  - type: redis
    name: glucosense-redis
    plan: starter
    maxmemoryPolicy: noeviction
