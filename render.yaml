# GlucoSense AI — Render Blueprint (free-tier hybrid deploy)
#
# What runs WHERE:
#   • Render (this file): the public API — auth, HC/CGM ingest, Junction webhooks,
#     sessions, food/vitals, coach (rule-based unless ANTHROPIC_API_KEY is set).
#     Docker runtime = the same image we run locally (native pip build of
#     torch/lightgbm/catboost would exceed the free tier).
#   • The dev Mac (hybrid, for now): the Celery worker+beat (Junction poll,
#     personal-model training) and the 62 GB model artefacts (gitignored, not in
#     the image) — forecasts/Virtual CGM serve from the Mac stack; both machines
#     share the same CockroachDB, so data written on Render is visible everywhere.
#     Render's free tier has no background workers — when upgrading to paid, see
#     the commented worker/redis blocks at the bottom.
#
# NOTE: the free web service spins down after ~15 min idle; the first request
# after that takes ~30-60s (cold start).

services:
  - type: web
    name: glucosense-api
    runtime: docker
    dockerfilePath: docker/Dockerfile.serve
    dockerContext: .
    plan: free
    # Co-located with CockroachDB (gcp-us-east1): API↔DB chatter dominates latency.
    region: virginia
    healthCheckPath: /health
    # Render injects $PORT; override the image's fixed :8000 bind.
    dockerCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # ── Database (CockroachDB Cloud) — paste in dashboard, never commit ─────
      - key: DATABASE_URL
        sync: false

      # ── Auth ────────────────────────────────────────────────────────────────
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "43200"   # 30 days; app enforces a sliding 5-day idle logout on top

      # ── Doctor Gluco (coach) ────────────────────────────────────────────────
      # No Ollama on Render: with ANTHROPIC_API_KEY unset the coach uses the safe
      # rule-based fallback. Set the key here later for full-LLM replies.
      - key: LLM_PROVIDER
        value: "auto"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: COACH_MODEL
        value: "claude-sonnet-4-6"
      - key: COACH_MAX_TOKENS
        value: "1024"

      # ── Junction (PRIMARY CGM — EU sandbox; switch host for production) ─────
      - key: JUNCTION_BASE_URL
        value: "https://api.sandbox.eu.junction.com"
      - key: JUNCTION_API_KEY
        sync: false
      - key: JUNCTION_WEBHOOK_SECRET
        sync: false
      - key: CGM_STALENESS_MINUTES
        value: "20"

      # ── Web / security ──────────────────────────────────────────────────────
      - key: CORS_ORIGINS
        sync: false          # e.g. https://glucosense-api.onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: PUBLIC_BASE_URL
        sync: false          # set to https://<this-service>.onrender.com after 1st deploy
      - key: FIELD_ENCRYPTION_KEY
        sync: false

      # ── Model config (artefacts absent on Render — endpoints degrade safely) ─
      - key: MODEL_DIR
        value: "models"
      - key: DEFAULT_INPUT_WINDOW_HOURS
        value: "6"
      - key: DEFAULT_POPULATION_MODEL
        value: "cgmacros"

      # ── Feature flags ───────────────────────────────────────────────────────
      - key: ENABLE_AI_RECOMMENDATIONS
        value: "true"
      - key: ENABLE_INDIVIDUAL_RETRAIN
        value: "false"   # training runs on the Mac worker in the hybrid setup

