{% extends "base.html" %}
{% block title %}Sign in · GlucoSense AI{% endblock %}
{% block auth_content %}
<div class="text-center mb-6">
  <div class="text-3xl">🩸</div>
  <h1 class="text-2xl font-semibold text-rose-600 mt-1">GlucoSense AI</h1>
  <p class="text-slate-500 text-sm mt-1">Your personal glucose copilot</p>
</div>
<div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
  <h2 class="font-semibold text-lg mb-4">Sign in</h2>
  {% if error %}
  <div class="mb-4 rounded-lg bg-rose-50 text-rose-700 text-sm px-3 py-2">{{ error }}</div>
  {% endif %}
  <form method="post" action="/login" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">Email</label>
      <input name="username" type="email" required value="{{ email or '' }}"
             class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-rose-400 focus:outline-none">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Password</label>
      <input name="password" type="password" required
             class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-rose-400 focus:outline-none">
    </div>
    <button class="w-full bg-rose-600 hover:bg-rose-700 text-white font-medium rounded-lg py-2.5">Sign in</button>
  </form>
</div>
<p class="text-center text-sm text-slate-500 mt-4">
  New here? <a href="/register" class="text-rose-600 font-medium">Create an account</a>
</p>
{% endblock %}
