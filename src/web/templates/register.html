{% extends "base.html" %}
{% block title %}Create account · GlucoSense AI{% endblock %}
{% block auth_content %}
<div class="text-center mb-6">
  <div class="text-3xl">🩸</div>
  <h1 class="text-2xl font-semibold text-rose-600 mt-1">GlucoSense AI</h1>
</div>
<div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
  <h2 class="font-semibold text-lg mb-4">Create your account</h2>
  {% if error %}
  <div class="mb-4 rounded-lg bg-rose-50 text-rose-700 text-sm px-3 py-2">{{ error }}</div>
  {% endif %}
  <form method="post" action="/register" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">Email</label>
      <input name="email" type="email" required value="{{ email or '' }}"
             class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-rose-400 focus:outline-none">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Password</label>
      <input name="password" type="password" required minlength="6"
             class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-rose-400 focus:outline-none">
      <p class="text-xs text-slate-400 mt-1">At least 6 characters.</p>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-sm font-medium mb-1">Participant ID</label>
        <input name="user_id" required placeholder="e.g. 019"
               class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-rose-400 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Dataset</label>
        <select name="dataset" class="w-full rounded-lg border border-slate-300 px-3 py-2 bg-white focus:ring-2 focus:ring-rose-400 focus:outline-none">
          {% for d in datasets %}<option value="{{ d }}">{{ d }}</option>{% endfor %}
        </select>
      </div>
    </div>
    <button class="w-full bg-rose-600 hover:bg-rose-700 text-white font-medium rounded-lg py-2.5">Create account</button>
  </form>
</div>
<p class="text-center text-sm text-slate-500 mt-4">
  Already have an account? <a href="/login" class="text-rose-600 font-medium">Sign in</a>
</p>
{% endblock %}
