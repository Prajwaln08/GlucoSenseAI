# GlucoSense AI — Alembic configuration
# Run migrations from the project root:
#   alembic upgrade head
#   alembic revision --autogenerate -m "description"

[alembic]
script_location = src/db/migrations
# Put the project root on sys.path so env.py can `import src.db...` when alembic
# is invoked from the repo root (e.g. Render's `alembic upgrade head` on deploy).
prepend_sys_path = .

# DATABASE_URL is injected from the environment in env.py — do not hardcode here.
# Alembic reads it from os.environ at runtime.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
