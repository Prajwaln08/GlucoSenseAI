# ──────────────────────────────────────────────────────────────────────────────
# GlucoSense AI — Compose (Phase 1 + Phase 2)
#
# Always-on services (docker compose up):
#   postgres — application DB (users, prediction_logs, retrain_jobs)
#   redis    — Celery broker + result backend
#   mlflow   — MLflow tracking server  (http://localhost:5000)
#   api      — FastAPI prediction API  (http://localhost:8000)
#
# On-demand (make targets):
#   worker   — Celery retraining worker (profiles: ["worker"])
#   train    — ML training container    (profiles: ["train"])
#
# Quick start:
#   make api       → starts postgres + redis + mlflow + api
#   make worker    → starts Celery worker (in addition)
#   make build     → build training image
#   make build-api → build serving image
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL — application database ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: glucosense-postgres
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-glucosense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB:       ${POSTGRES_DB:-glucosense}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-glucosense}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis — Celery broker + result backend ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: glucosense-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── MLflow Tracking Server ─────────────────────────────────────────────────
  # Persists run metadata in SQLite (./mlflow/mlflow.db) and artefacts
  # (plots, feature_cols.json) under ./mlflow/artifacts/.
  # Both paths are bind-mounted so data survives container restarts.
  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: glucosense-train:latest
    container_name: glucosense-mlflow
    command: >
      mlflow server
        --backend-store-uri sqlite:////mlflow/mlflow.db
        --default-artifact-root /mlflow/artifacts
        --host 0.0.0.0
        --port 5000
    ports:
      - "5001:5000"   # host 5001 — macOS AirPlay occupies 5000
    volumes:
      - ./mlflow:/mlflow
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── FastAPI Serving Container ──────────────────────────────────────────────
  # Runs the prediction API on port 8000.
  # Pre-loads all 4 population models into RAM on startup (warm_cache).
  # Models dir is bind-mounted so the API always uses the latest trained artefacts.
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.serve
    image: glucosense-api:latest
    container_name: glucosense-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro   # read-only — API never writes models
      - ./uploads:/app/uploads    # chat attachments — writable
      # CockroachDB Cloud CA cert — libpq's default lookup path for sslmode=verify-full
      - ~/.postgresql:/root/.postgresql:ro
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PYTHONPATH: /app
      # DATABASE_URL from .env wins (e.g. CockroachDB Cloud); falls back to the
      # local postgres service. NOTE: a localhost URL is unreachable from inside
      # the container — use the real external host or leave DATABASE_URL unset.
      DATABASE_URL: ${DATABASE_URL:-postgresql://glucosense:changeme@postgres:5432/glucosense}
      # Ollama runs on the HOST Mac — inside the container "localhost" is the container.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    env_file:
      - .env
    depends_on:
      mlflow:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── Celery Worker — individual model retraining ────────────────────────────
  # Not started by `docker compose up` — launch with `make worker`.
  # Requires postgres + redis to be healthy before starting.
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.serve
    image: glucosense-api:latest
    container_name: glucosense-worker
    command: >
      celery -A src.tasks.celery_app worker
        --loglevel=info
        -Q glucosense
        --concurrency=1
        -B
    volumes:
      - ./models:/app/models
      - ./data:/app/data:ro
      # CockroachDB Cloud CA cert (same as api service)
      - ~/.postgresql:/root/.postgresql:ro
    environment:
      PYTHONPATH: /app
      # Same passthrough as the api service — .env DATABASE_URL (CockroachDB) wins.
      DATABASE_URL: ${DATABASE_URL:-postgresql://glucosense:changeme@postgres:5432/glucosense}
      BROKER_URL: redis://redis:6379/0
      BACKEND_URL: redis://redis:6379/1
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The API image's healthcheck curls :8000, which a Celery worker never serves —
    # ping the worker over the broker instead.
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.tasks.celery_app inspect ping --timeout 10 | grep -q pong || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    profiles:
      - worker
    restart: unless-stopped

  # ── Training Container ─────────────────────────────────────────────────────
  # Not started by `docker compose up` — always invoked via
  # `docker compose run --rm train python scripts/...`
  # Waits for MLflow to be healthy before running so logs are always captured.
  train:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: glucosense-train:latest
    container_name: glucosense-train
    command: ["bash"]
    stdin_open: true
    tty: true
    volumes:
      # Data and model artefacts are bind-mounted so nothing is baked into the
      # image and results survive between runs.
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
      # Share the MLflow volume so artefact paths resolve inside the container.
      - ./mlflow:/mlflow
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-glucosense}
      PYTHONPATH: /app
    env_file:
      - .env
    depends_on:
      mlflow:
        condition: service_healthy
    # `profiles` keeps this out of `docker compose up` — only started explicitly.
    profiles:
      - train

volumes:
  postgres_data:
  redis_data:
